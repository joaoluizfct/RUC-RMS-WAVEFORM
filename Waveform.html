<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUC · Gerador de Waveform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.2/lib/p5.min.js"></script>
  <style>
    :root {
      --ruc-red: #E31E24;
      --ruc-red-hover: #c5171d;
      --bg-page: #f4f4f5;
      --bg-card: #ffffff;
      --text-main: #18181b;
      --text-muted: #52525b;
      --border-color: #e4e4e7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 470px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card.drag-over {
      border-color: var(--ruc-red);
      box-shadow: 0 0 0 3px rgba(227, 30, 36, 0.15);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--ruc-red);
      background: rgba(227, 30, 36, 0.08);
      padding: 4px 8px;
      border-radius: 4px;
    }

    #canvas-wrapper {
      width: 420px;
      height: 84px;
      margin: 0 auto 18px auto;
      border-radius: 6px;
      border: 1px solid #d4d4d8;
      overflow: hidden;
      background-image:
        linear-gradient(45deg, #e4e4e7 25%, transparent 25%),
        linear-gradient(-45deg, #e4e4e7 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e4e4e7 75%),
        linear-gradient(-45deg, transparent 75%, #e4e4e7 75%);
      background-size: 14px 14px;
      background-position: 0 0, 0 7px, 7px -7px, -7px 0;
    }

    #canvas-wrapper canvas {
      display: block;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-import {
      background: #18181b;
      color: #ffffff;
    }

    .btn-import:hover:not(:disabled) {
      background: #27272a;
    }

    .btn-play {
      background: #e4e4e7;
      color: #18181b;
    }

    .btn-play:hover:not(:disabled) {
      background: #d4d4d8;
    }

    .btn-export {
      background: var(--ruc-red);
      color: #ffffff;
      margin-left: auto;
    }

    .btn-export:hover:not(:disabled) {
      background: var(--ruc-red-hover);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--ruc-red);
      cursor: pointer;
    }

    .status-box {
      font-size: 12px;
      color: var(--text-muted);
      background: #fafafa;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 12px;
      line-height: 1.45;
    }

    .status-box a {
      color: var(--ruc-red);
      font-weight: 600;
      text-decoration: none;
    }

    .status-box a:hover {
      text-decoration: underline;
    }

    .footer-hint {
      margin-top: 12px;
      font-size: 11px;
      color: #71717a;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="card" id="drop-zone">
    <div class="header">
      <h1>RUC · Waveform de Entrevista</h1>
      <span class="badge">420 × 84 px · Transparente</span>
    </div>

    <div id="canvas-wrapper"></div>

    <input
      type="file"
      id="input-audio"
      accept=".mp3,.wav,.ogg,.m4a,.aac,.flac,audio/*"
      hidden
    />

    <div class="controls">
      <button type="button" class="btn-import" id="btn-import">Importar Áudio</button>
      <button type="button" class="btn-play" id="btn-play" disabled>Tocar / Pausa</button>
      <button type="button" class="btn-export" id="btn-export" disabled>Exportar Waveform</button>
    </div>

    <div class="slider-row">
      <label for="slider-sensibilidade">Sensibilidade da voz:</label>
      <input type="range" id="slider-sensibilidade" min="0.5" max="2.5" step="0.05" value="1.3" />
    </div>

    <div class="status-box" id="status-texto">
      Importa ou arrasta um ficheiro de áudio (.mp3, .wav, .m4a) para começar.
    </div>

    <p class="footer-hint">
      Posição no template 4×5: <strong>X: 60, Y: 1226</strong>. Para manter o fundo transparente no ficheiro <code>.webm</code>, utiliza Google Chrome, Microsoft Edge ou Brave.
    </p>
  </main>

  <script src="sketch.js"></script>
</body>
</html>
