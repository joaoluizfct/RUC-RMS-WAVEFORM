<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUC · Gerador de Waveform (107.9 FM)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Syne:wght@400..800&family=Trochut:ital,wght@0,400;0,700;1,400&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.2/lib/p5.min.js"></script>
  <style>
    :root {
      --ruc-bg: #1A1A1A;
      --ruc-bg-deep: #121212;
      --ruc-border: #383838;
      --ruc-red: #C53030;
      --ruc-white: #F7F6ED;
      --ruc-muted: #9A9A95;
      --font-display: 'Oswald', sans-serif;
      --font-ui: 'Syne', sans-serif;
      --font-body: 'Work Sans', sans-serif;
      --font-editorial: 'Trochut', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--ruc-bg-deep);
      color: var(--ruc-white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .ruc-shell {
      width: 100%;
      max-width: 980px;
      background: var(--ruc-bg);
      border: 1px solid var(--ruc-border);
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s ease;
    }

    .ruc-shell.drag-over {
      border-color: var(--ruc-red);
      outline: 2px solid var(--ruc-red);
    }

    /* Cabeçalho RUC */
    .ruc-topbar {
      display: grid;
      grid-template-columns: 124px 1fr auto;
      border-bottom: 1px solid var(--ruc-border);
    }

    .ruc-logo-box {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 16px;
      border-right: 1px solid var(--ruc-border);
      background: var(--ruc-bg);
    }

    .ruc-logo-box svg {
      height: 30px;
      width: auto;
      fill: var(--ruc-white);
      display: block;
    }

    .ruc-title-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 18px;
      border-right: 1px solid var(--ruc-border);
    }

    .ruc-title-box h1 {
      font-family: var(--font-display);
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ruc-white);
      line-height: 1.05;
    }

    .ruc-title-box span {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--ruc-muted);
      margin-top: 4px;
    }

    .ruc-freq-box {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--ruc-white);
    }

    /* Grelha principal */
    .ruc-main {
      display: grid;
      grid-template-columns: 1fr 420px;
    }

    @media (max-width: 840px) {
      .ruc-topbar {
        grid-template-columns: 108px 1fr;
      }
      .ruc-freq-box {
        display: none;
      }
      .ruc-main {
        grid-template-columns: 1fr;
      }
    }

    .ruc-stage {
      background: var(--ruc-bg-deep);
      border-right: 1px solid var(--ruc-border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    @media (max-width: 840px) {
      .ruc-stage {
        border-right: none;
        border-bottom: 1px solid var(--ruc-border);
      }
    }

    #canvas-wrapper {
      position: relative;
      width: 392px;
      height: 490px;
      border: 1px solid var(--ruc-border);
      background: #141414;
      overflow: hidden;
      flex-shrink: 0;
    }

    #canvas-wrapper.is-story {
      width: 276px;
      height: 490px;
    }

    #canvas-wrapper canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* Ícone de importação centrado quando não há imagem */
    .canvas-import-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
    }

    .canvas-import-overlay .icon-box {
      width: 56px;
      height: 56px;
      border: 1px solid var(--ruc-border);
      background: rgba(26, 26, 26, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .canvas-import-overlay:hover .icon-box {
      background: var(--ruc-red);
      border-color: var(--ruc-red);
    }

    .canvas-import-overlay svg {
      width: 24px;
      height: 24px;
      stroke: var(--ruc-white);
      fill: none;
      stroke-width: 1.8;
    }

    #canvas-wrapper.has-image .canvas-import-overlay {
      display: none;
    }

    /* Overlay de lixeira no hover quando há imagem carregada */
    .canvas-remove-overlay {
      position: absolute;
      inset: 0;
      background: rgba(18, 18, 18, 0.62);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
    }

    #canvas-wrapper.has-image:hover .canvas-remove-overlay {
      display: flex;
    }

    .canvas-remove-overlay .trash-box {
      width: 54px;
      height: 54px;
      border: 1px solid var(--ruc-white);
      background: var(--ruc-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .canvas-remove-overlay:hover .trash-box {
      background: var(--ruc-red);
      border-color: var(--ruc-red);
    }

    .canvas-remove-overlay svg {
      width: 22px;
      height: 22px;
      stroke: var(--ruc-white);
      fill: none;
      stroke-width: 1.8;
    }

    /* Coluna de controlos */
    .ruc-controls {
      display: flex;
      flex-direction: column;
    }

    .control-block {
      border-bottom: 1px solid var(--ruc-border);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-block:last-child {
      border-bottom: none;
      flex: 1;
      justify-content: space-between;
    }

    .block-label {
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ruc-muted);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--ruc-border);
    }

    .grid-2 > button:first-child {
      border-right: 1px solid var(--ruc-border);
    }

    button {
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ruc-white);
      background: var(--ruc-bg);
      border: none;
      padding: 12px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--ruc-red);
      color: var(--ruc-white);
    }

    button.active {
      background: var(--ruc-red);
      color: var(--ruc-white);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Botões de cor no Passo 3: hover e active assumem a cor da waveform */
    #btn-cor-vermelho:hover:not(:disabled),
    #btn-cor-vermelho.active {
      background: #C53030;
      color: #F7F6ED;
    }

    #btn-cor-branco:hover:not(:disabled),
    #btn-cor-branco.active {
      background: #F7F6ED;
      color: #1A1A1A;
    }

    /* Passo 4: Slider + Bolinha dinâmica */
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: var(--ruc-border);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: var(--ruc-white);
      border: 1px solid var(--ruc-bg);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: var(--ruc-red);
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: var(--ruc-white);
      border: none;
      cursor: pointer;
    }

    .sens-dot-box {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sens-dot {
      display: block;
      width: 15.8px;
      height: 15.8px;
      border-radius: 50% !important;
      background-color: #C53030;
      transition: background-color 0.15s ease;
    }

    .btn-export-main {
      width: 100%;
      border: 1px solid var(--ruc-border);
      padding: 14px 12px;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    /* Barra Inferior estilo Player RUC */
    .ruc-playerbar {
      display: grid;
      grid-template-columns: 136px 1fr auto;
      border-top: 1px solid var(--ruc-border);
      background: var(--ruc-bg);
      min-height: 48px;
    }

    .btn-player {
      border-right: 1px solid var(--ruc-border);
      height: 100%;
      font-weight: 700;
    }

    .player-status {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 16px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      color: var(--ruc-white);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      background: var(--ruc-red);
      color: var(--ruc-white);
      padding: 4px 10px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-decoration: none;
    }

    a.status-pill {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    a.status-pill:hover {
      background: var(--ruc-white);
      color: var(--ruc-bg);
    }

    .player-time {
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-left: 1px solid var(--ruc-border);
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
      color: var(--ruc-muted);
    }
  </style>
</head>
<body>
  <div class="ruc-shell" id="drop-zone">
    <!-- Cabeçalho RUC -->
    <header class="ruc-topbar">
      <div class="ruc-logo-box" title="Rádio Universidade de Coimbra">
        <svg viewBox="0 0 266 98" aria-label="RUC">
          <path fill-rule="evenodd" d="M0 98V39h9.5A27 27 0 1 1 47.5 51.2L74.5 98h-19L29.5 55.5h-12V98H0zm35.5-82.8a11.8 11.8 0 1 0 0 23.6 11.8 11.8 0 1 0 0-23.6z"/>
          <path d="M87.5 98V17.5H103V1h18.5v33.5H106v46h39v-46h15.5V1H179v51h-15.5v46h-76z"/>
          <path d="M249 0v16a38.5 33 0 1 0 0 66v16a55 49 0 1 1 0-98z"/>
          <circle cx="251.5" cy="49" r="13.8"/>
        </svg>
      </div>
      <div class="ruc-title-box">
        <h1>Gerador de Waveform</h1>
        <span>Rádio Universidade de Coimbra</span>
      </div>
      <div class="ruc-freq-box">107.9 FM</div>
    </header>

    <!-- Área Principal -->
    <div class="ruc-main">
      <section class="ruc-stage">
        <div id="canvas-wrapper">
          <!-- Ícone central para importar imagem quando o canvas está vazio -->
          <div class="canvas-import-overlay" id="canvas-import-trigger" title="Importar imagem">
            <div class="icon-box">
              <svg viewBox="0 0 24 24" stroke-linecap="square" stroke-linejoin="miter">
                <path d="M12 16V4" />
                <path d="M7 9l5-5 5 5" />
                <path d="M4 20h16" />
              </svg>
            </div>
          </div>

          <!-- Ícone de lixeira no hover quando há imagem carregada -->
          <div class="canvas-remove-overlay" id="canvas-remove-trigger" title="Remover imagem">
            <div class="trash-box">
              <svg viewBox="0 0 24 24" stroke-linecap="square" stroke-linejoin="miter">
                <path d="M3 6h18" />
                <path d="M8 6V4h8v2" />
                <path d="M6 6l1 14h10l1-14" />
                <path d="M10 10v6" />
                <path d="M14 10v6" />
              </svg>
            </div>
          </div>
        </div>
      </section>

      <aside class="ruc-controls">
        <input type="file" id="input-imagem" accept="image/png,image/jpeg,image/webp" hidden />
        <input type="file" id="input-audio" accept=".mp3,.wav,.ogg,.m4a,.aac,.flac,audio/*" hidden />

        <!-- 1 - Importar ficheiros -->
        <div class="control-block">
          <span class="block-label">1 - Importar ficheiros</span>
          <div class="grid-2">
            <button type="button" id="btn-import-img">Importar Imagem</button>
            <button type="button" id="btn-import-audio">Importar Áudio</button>
          </div>
        </div>

        <!-- 2 - Layout -->
        <div class="control-block">
          <span class="block-label">2 - Layout</span>
          <div class="grid-2">
            <button type="button" id="btn-fmt-post" class="active">Post (1080×1350)</button>
            <button type="button" id="btn-fmt-story">Story / Reels (1080×1920)</button>
          </div>
        </div>

        <!-- 3 - Cor da Waveform -->
        <div class="control-block">
          <span class="block-label">3 - Cor da Waveform</span>
          <div class="grid-2">
            <button type="button" id="btn-cor-vermelho" class="active">Vermelho</button>
            <button type="button" id="btn-cor-branco">Branco</button>
          </div>
        </div>

        <!-- 4 - Sensibilidade da Waveform -->
        <div class="control-block">
          <span class="block-label">4 - Sensibilidade da Waveform</span>
          <div class="slider-wrap">
            <input type="range" id="slider-sensibilidade" min="0.5" max="2.5" step="0.05" value="1.3" />
            <div class="sens-dot-box" title="Amplitude da bolinha">
              <span class="sens-dot" id="sens-dot"></span>
            </div>
          </div>
        </div>

        <!-- 5 - Exportar Post -->
        <div class="control-block">
          <span class="block-label">5 - Exportar Post</span>
          <div class="grid-2">
            <button type="button" id="btn-ext-mp4" class="active">.mp4</button>
            <button type="button" id="btn-ext-mov">.mov</button>
          </div>
          <button type="button" class="btn-export-main" id="btn-export" disabled>
            Exportar Vídeo com Áudio
          </button>
        </div>
      </aside>
    </div>

    <!-- Barra Inferior estilo Player RUC -->
    <footer class="ruc-playerbar">
      <button type="button" class="btn-player" id="btn-play" disabled>▶ Play</button>
      <div class="player-status" id="status-texto">
        Importa a imagem e o áudio para começar.
      </div>
      <div class="player-time" id="player-time">00:00 / 00:00</div>
    </footer>
  </div>

  <script src="sketch.js?v=7"></script>
</body>
</html>
